server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    location /engine/ {
        proxy_pass http://backend:8765/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location /evidence/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
